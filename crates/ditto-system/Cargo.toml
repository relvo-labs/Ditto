[package]
name = "ditto-system"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[features]
# The notification server and logind need a D-Bus connection. Without the
# feature both report `component_available == false`; the index and launch
# still work, which is what a bus-less test environment needs.
default = ["dbus"]
dbus = ["dep:zbus"]

[dependencies]
ditto-protocol = { path = "../ditto-protocol" }
serde.workspace = true
serde_json.workspace = true
libc = "=0.2.189"
zbus = { version = "=5.19.0", optional = true, default-features = false, features = ["async-io", "blocking-api"] }
