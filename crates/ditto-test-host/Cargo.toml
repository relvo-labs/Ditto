[package]
name = "ditto-test-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Trusted reference/VM fixtures only; absent from shipping binaries.
fault-injection = []

[dependencies]
ditto-protocol = { path = "../ditto-protocol" }
libc = "=0.2.189"
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "ditto-test-host"
path = "src/main.rs"

[[bin]]
name = "ditto-test-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "ditto-generation-host"
path = "src/bin/generation.rs"
