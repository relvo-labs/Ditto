[package]
name = "ditto-store"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[features]
# Test-only fault points (SQLITE_IOERR simulation). Never enabled in a release
# build; CI checks the release binaries carry no fault-point symbols.
fault-injection = []

[dependencies]
ditto-protocol = { path = "../ditto-protocol" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
libc = "0.2"
