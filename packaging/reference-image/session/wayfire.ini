# Physical-login configuration for the Ditto reference session (G1; G0 used the
# same file through ditto-g0-session).
[core]
plugins = ipc ipc-rules wm-actions vswitch foreign-toplevel ext-toplevel xdg-activation session-lock wayfire-shell shortcuts-inhibit security-context-v1 input-method-v1 move resize place decoration command switcher expo stipc
close_top_view = <super> KEY_Q

[workarounds]
enable_input_method_v2 = false

[input-method-v1]
enable_text_input_v1 = true
enable_text_input_v3 = true

[output:HDMI-A-3]
mode = 1920x1080@60000
scale = 1.000000

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_logout = <ctrl> <alt> KEY_DELETE
command_logout = /usr/local/libexec/ditto-logout

[input]
xkb_layout = us

# #116 J1 果凍玻璃, the default style (owner 2026-10-20): server-side title
# bars of other applications (foot asks for them). Same values as
# styles/j1/wayfire-decoration.ini (tools/ui-candidates/check-styles.py).
[decoration]
font = Noto Sans CJK TC
font_color = #231d3bff
font_scale = 0.42
title_height = 34
border_size = 2
button_order = minimize maximize close
button_scale = 0.5
button_padding = 9
active_color = #e9e4fbff
inactive_color = #f4f2fde0
