# Physical-login configuration for the frozen G0 reference session.
[core]
plugins = ipc ipc-rules wm-actions vswitch foreign-toplevel ext-toplevel xdg-activation session-lock wayfire-shell shortcuts-inhibit security-context-v1 input-method-v1 move resize place decoration command switcher expo stipc
close_top_view = <super> KEY_Q

[workarounds]
enable_input_method_v2 = false

[input-method-v1]
enable_text_input_v1 = true
enable_text_input_v3 = true

[output:HDMI-A-3]
mode = 1920x1080@60000
scale = 1.000000

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_logout = <ctrl> <alt> KEY_DELETE
command_logout = /usr/local/libexec/ditto-g0-logout

[input]
xkb_layout = us
