# xdg-desktop-portal-wlr in the Ditto session. Installed as
# /etc/xdg/xdg-desktop-portal-wlr/Wayfire (read only when
# XDG_CURRENT_DESKTOP=Wayfire).
# Remote access (RustDesk) asks for a screen with nobody at the seat to pick
# one, so the first output is shared without a chooser. Any program in this
# session may then capture the screen: the owner accepted this for remote
# access on 2026-10-09 (README.md, "畫面分享與遠端存取").
[screencast]
chooser_type=none
