# #116 J1 果凍玻璃 (jelly glass), the default: Wayfire `decoration` (server-side title bars), quiet lavender white, a touch see-through.
# The owner chose (2026-10-20) three selectable styles with J1 as default.
# J1's section is the installed session's (session/wayfire.ini repeats it;
# tools/ui-candidates/check-styles.py keeps them equal). J2 and J3 can be
# previewed live with tools/ui-candidates/apply.sh; that Wayfire and foot
# follow the style chosen in personalization is a follow-up (component-sheet
# §8), so other applications keep J1 until then.
#
# Frozen Wayfire 0.11.0: only the options below exist (metadata decoration.xml).
# There is no corner radius, shadow or per-button colour option, and the
# button hover colours (red / green / yellow) are compiled into
# libdecoration.so. font_color is one colour for active and inactive title
# bars: check-styles.py keeps it ≥4.5:1 on both, also over black.
[decoration]
font = Noto Sans CJK TC
font_color = #231d3bff
font_scale = 0.42
title_height = 34
border_size = 2
button_order = minimize maximize close
button_scale = 0.5
button_padding = 9
active_color = #e9e4fbff
inactive_color = #f4f2fde0
