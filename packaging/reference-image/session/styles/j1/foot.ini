# #116 J1 果凍玻璃 (jelly glass), the default: foot, the supported terminal; quiet lavender white, a touch see-through.
# Installed by default: the session puts packaging/reference-image/session/xdg (whose foot/foot.ini is this file) in front of XDG_CONFIG_DIRS.
# A person's own ~/.config/foot/foot.ini still wins (foot reads
# XDG_CONFIG_HOME before XDG_CONFIG_DIRS). Keys are foot 1.16 (Ubuntu 24.04).
# Every regular/bright colour is ≥4.5:1 on the background and the selection
# keeps the foreground colour (tools/ui-candidates/check-styles.py).

[main]
font=Noto Sans Mono CJK TC:size=11.5, monospace:size=11.5
pad=14x12 center
dpi-aware=no

[cursor]
style=beam
blink=yes
color=f4f2fd 6552d6

[colors]
alpha=0.97
foreground=231d3b
background=f4f2fd
selection-foreground=231d3b
selection-background=dcd5fa
urls=4a3cb5
regular0=231d3b
regular1=a8304f
regular2=236144
regular3=7a4a05
regular4=4a3cb5
regular5=7b3aa6
regular6=1d6270
regular7=5a5476
bright0=4e4868
bright1=b8395c
bright2=2a7050
bright3=86540a
bright4=5446c8
bright5=8a45b8
bright6=236f7e
bright7=231d3b

# One title bar: Wayfire's (the style's [decoration]). foot asks for a
# server-side decoration and draws none of its own, so a foot window no
# longer shows two title bars (VM review 2026-10-20).
[csd]
preferred=server
