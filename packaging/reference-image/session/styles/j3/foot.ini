# #116 J3 泡泡 (bubble): foot, the supported terminal; cool water blue.
# Preview only (tools/ui-candidates/apply.sh); the installed default is J1.
# A person's own ~/.config/foot/foot.ini still wins (foot reads
# XDG_CONFIG_HOME before XDG_CONFIG_DIRS). Keys are foot 1.16 (Ubuntu 24.04).
# Every regular/bright colour is ≥4.5:1 on the background and the selection
# keeps the foreground colour (tools/ui-candidates/check-styles.py).

[main]
font=Noto Sans Mono CJK TC:size=11.5, monospace:size=11.5
pad=14x12 center
dpi-aware=no

[cursor]
style=beam
blink=yes
color=eef5fb 2a74a0

[colors]
alpha=0.96
foreground=1d2440
background=eef5fb
selection-foreground=1d2440
selection-background=cfe3f5
urls=2f55a8
regular0=1d2440
regular1=a22d50
regular2=1d6045
regular3=704806
regular4=3b48b0
regular5=6f3ca6
regular6=0f5f72
regular7=4f5672
bright0=434a68
bright1=af3659
bright2=226b4e
bright3=7c5009
bright4=4652c0
bright5=7d46b4
bright6=136a7e
bright7=1d2440

# One title bar: Wayfire's (the style's [decoration]). foot asks for a
# server-side decoration and draws none of its own, so a foot window no
# longer shows two title bars (VM review 2026-10-20).
[csd]
preferred=server
