# xdg-desktop-portal backends for the Ditto session (XDG_CURRENT_DESKTOP=Wayfire).
# Installed as /etc/xdg/xdg-desktop-portal/wayfire-portals.conf.
# Screen capture goes to xdg-desktop-portal-wlr, which reads Wayfire's
# wlr-screencopy (RustDesk, browser screen sharing); everything else stays on
# GTK, which was the fallback before this file existed.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
