# #116 candidate J3 泡泡 (bubble): Wayfire `decoration` (server-side title bars).
# A proposal for the owner to choose from; NOT installed by default.
# tools/ui-candidates/apply.sh merges this section into a copy of the session
# wayfire.ini and sets the same options live through Wayfire IPC
# (`wayfire/set-config-options`); `apply.sh off` restores the values it read.
#
# Frozen Wayfire 0.11.0: only the options below exist (metadata decoration.xml).
# There is no corner radius, shadow or per-button colour option. The button
# glyphs are drawn by the plugin; their hover colours (red / green / yellow)
# are compiled in (libdecoration.so), so a server-side window still shows
# them on hover. foot avoids this by drawing its own title bar (foot.ini
# [csd]); see docs/design/default-desktop/component-sheet.md §8.
[decoration]
font = Noto Sans CJK TC
font_color = #221f3cff
font_scale = 0.42
title_height = 34
border_size = 2
button_order = minimize maximize close
button_scale = 0.5
button_padding = 9
active_color = #f6f6ffe8
inactive_color = #eeeefbd0
