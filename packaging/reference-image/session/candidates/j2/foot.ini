# #116 candidate J2 軟糖 (gummy): foot, the supported terminal.
# A proposal for the owner to choose from; NOT installed by default. Written
# by tools/ui-candidates/apply.sh to a session-only directory that is put in
# front of XDG_CONFIG_DIRS, so a person's own ~/.config/foot/foot.ini still
# wins. Keys are foot 1.16 (Ubuntu 24.04); apply.sh runs `foot --check-config`.
# Every regular/bright colour is ≥5:1 on the background; selected text keeps
# the foreground colour (≥10:1).

[main]
font=Noto Sans Mono CJK TC:size=11.5, monospace:size=11.5
pad=14x12 center
dpi-aware=no

[cursor]
style=beam
blink=yes
color=f3ecfc 6c45dc

[colors]
alpha=1.0
foreground=241a3e
background=f3ecfc
selection-foreground=241a3e
selection-background=d9c9fb
urls=4e34c4
regular0=241a3e
regular1=a52c4e
regular2=226043
regular3=784804
regular4=4e34c4
regular5=7d33a8
regular6=1c606e
regular7=594d74
bright0=4c4268
bright1=b53557
bright2=286c4d
bright3=835009
bright4=5a3fd6
bright5=8a3fb8
bright6=226c7a
bright7=241a3e

# foot draws its own title bar here instead of Wayfire's, so its buttons are
# three lavender beads (colours are AARRGGBB) and never the compiled-in hover
# colours of the decoration plugin.
[csd]
preferred=client
size=32
color=ffebe1fb
border-width=1
border-color=ffcdbdf6
button-width=30
button-color=ff2b2350
button-minimize-color=ffd9cbfb
button-maximize-color=ffb9a2f5
button-close-color=ff9476ec
