# #116 candidate J1 果凍玻璃 (jelly glass): foot, the supported terminal.
# A proposal for the owner to choose from; NOT installed by default. Written
# by tools/ui-candidates/apply.sh to a session-only directory that is put in
# front of XDG_CONFIG_DIRS, so a person's own ~/.config/foot/foot.ini still
# wins. Keys are foot 1.16 (Ubuntu 24.04); apply.sh runs `foot --check-config`.
# Every regular/bright colour is ≥5:1 on the background; selected text keeps
# the foreground colour (≥10:1).

[main]
font=Noto Sans Mono CJK TC:size=11.5, monospace:size=11.5
pad=14x12 center
dpi-aware=no

[cursor]
style=beam
blink=yes
color=f4f2fd 6552d6

[colors]
alpha=0.97
foreground=231d3b
background=f4f2fd
selection-foreground=231d3b
selection-background=dcd5fa
urls=4a3cb5
regular0=231d3b
regular1=a8304f
regular2=236144
regular3=7a4a05
regular4=4a3cb5
regular5=7b3aa6
regular6=1d6270
regular7=5a5476
bright0=4e4868
bright1=b8395c
bright2=2a7050
bright3=86540a
bright4=5446c8
bright5=8a45b8
bright6=236f7e
bright7=231d3b

# foot draws its own title bar here instead of Wayfire's, so its buttons are
# three lavender beads (colours are AARRGGBB) and never the compiled-in hover
# colours of the decoration plugin.
[csd]
preferred=client
size=32
color=fff1eefc
border-width=1
border-color=ffc9c0ef
button-width=30
button-color=ff2b2350
button-minimize-color=ffddd6fa
button-maximize-color=ffc2b6f3
button-close-color=ffa596ea
