[core]
plugins = autostart command wayfire-shell input-method-v1
xwayland = false
[input]
xkb_layout = us
[input-method-v1]
enable_text_input_v1 = true
enable_text_input_v3 = true

[workarounds]
enable_input_method_v2 = false
[autostart]
autostart_wf_shell = false
firstboot = /usr/lib/ditto/ditto-greeter --session
[command]
binding_orca = <super> <alt> KEY_S
command_orca = /usr/lib/ditto/ditto-greeter --orca
