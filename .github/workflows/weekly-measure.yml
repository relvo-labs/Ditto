name: weekly-measure
on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:
# Weekly trend run: restart measured services, warm up, sample, three times.
# This is not a display-manager cold login, so measure-conditions.json keeps
# `cold_login_each_run: false` and the report cannot pass EX-05 by itself.
jobs:
  measure:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 180
    env:
      DITTO_REFERENCE_MACHINE: '1'
      DITTO_ENVIRONMENT_LABEL: reference-machine
      DITTO_WORKSPACE: ${{ github.workspace }}
      DITTO_BINARIES: ${{ github.workspace }}/target/debug
      DITTO_ARTIFACTS: ${{ github.workspace }}/artifacts/g0
      DITTO_COMPOSITOR: wayfire
    steps:
      - uses: actions/checkout@v4
      - name: Reference toolchain paths
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nvm/versions/node/v22.23.2/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.10.2/gcc_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/wayfire/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/wayfire/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Reference-machine preflight
        run: bash packaging/reference-image/preflight.sh
      - run: cargo build --locked --workspace --bins
      - name: Resource measurement
        run: bash tests/g0/measure/run.sh packaging/reference-image/measure-manifest.json packaging/reference-image/measure-conditions.json
      - name: Tool quota baseline
        run: bash tests/g0/quota-baseline/run.sh
      # Run ids carry ISO timestamps, and upload-artifact rejects ':' in file
      # names. The archive keeps every artifact under its own name.
      - name: Pack artifacts
        if: always()
        run: tar -czf g0-measure-artifacts.tar.gz --ignore-failed-read artifacts/g0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-measure-${{ github.run_id }}
          path: g0-measure-artifacts.tar.gz
          retention-days: 180
