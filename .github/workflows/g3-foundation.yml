name: g3-foundation
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/ditto-generation/**', 'crates/ditto-test-host/**', 'crates/ditto-confine/**', 'tests/g3/**', 'plan/05/**', '.github/workflows/g3-foundation.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/ditto-generation/**', 'crates/ditto-test-host/**', 'crates/ditto-confine/**', 'tests/g3/**', 'plan/05/**', '.github/workflows/g3-foundation.yml']
jobs:
  verify:
    runs-on: [self-hosted, ditto-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Rust and fixed QML SDK checks
        run: bash tests/g3/run.sh
      - name: Independent infrastructure lint
        run: cargo clippy --locked -p ditto-test-host -p ditto-generation --all-targets -- -D warnings
      - name: Refuse unavailable isolation and invalid commands
        run: python3 tests/g3/host/rejection.py
      # Resource exhaustion stays in tools/dev-vm/run-g3.sh (D-25), not in a
      # shared CI runner session. VM and reference-seat evidence remain separate.
