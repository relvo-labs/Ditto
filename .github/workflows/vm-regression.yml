name: vm-regression
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'crates/**'
      - 'shell/**'
      - 'tests/g0/**'
      - 'tests/g1/**'
      - 'packages/**'
      - 'schema/**'
      - 'tools/**'
      - 'packaging/reference-image/**'
      - '.github/workflows/vm-regression.yml'
  schedule:
    # 00:00 Asia/Taipei, before nightly-refmachine at 02:00. The single runner
    # runs jobs one at a time, so the VM is never up during a reference run.
    - cron: '0 16 * * *'
  workflow_dispatch:
# D-25: the first-line automated run. The libvirt VM on the reference machine
# is restored from its snapshot for G0, then again for G1's non-graphical
# checks, and shut down after each run. Everything it produces is development
# evidence; exit gates stay on the physical reference machine.
concurrency:
  group: vm-regression
  cancel-in-progress: false
jobs:
  vm:
    runs-on: [self-hosted, ditto-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: VM regression
        run: bash tools/dev-vm/run.sh
      # Run ids carry ISO timestamps, and upload-artifact rejects ':' in file
      # names. The archive keeps every artifact under its own name.
      - name: Pack artifacts
        if: always()
        run: tar -czf g0-vm-artifacts.tar.gz --ignore-failed-read artifacts/g0-vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-vm-${{ github.run_id }}
          path: g0-vm-artifacts.tar.gz
          retention-days: 30
      # G1's VM-runnable checks are merge-blocking. The other G1 runners have
      # physical-session or operator checks and keep their incomplete result;
      # they are run by run-g1.sh during development and on the reference gate.
      - name: G1 non-graphical regression
        if: success() || failure()
        run: bash tools/dev-vm/run-g1.sh rust-workspace node-workspace contract-vectors
      - name: Pack G1 VM artifacts
        if: always()
        run: tar -czf g1-vm-artifacts.tar.gz --ignore-failed-read artifacts/g1-vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-vm-${{ github.run_id }}
          path: g1-vm-artifacts.tar.gz
          retention-days: 30
