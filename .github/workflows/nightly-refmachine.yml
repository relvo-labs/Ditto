name: nightly-refmachine
# TEMPORARY probe branch (hermes/g2-ref-probe): read-only state of the
# reference machine before G2 exit runs. Not for merge.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 10
    steps:
      - name: Read-only reference machine state
        run: |
          set +e
          echo "== time"; date -Is; uptime
          echo "== host"; hostname; uname -r; grep MemTotal /proc/meminfo; lscpu | grep 'Model name'
          echo "== sessions"; loginctl list-sessions --no-legend
          for s in $(loginctl list-sessions --no-legend | awk '{print $1}'); do echo "-- $s"; loginctl show-session "$s" -p Name -p Type -p Class -p Desktop -p State -p Active -p Seat -p Remote -p IdleHint -p IdleSinceHint -p Timestamp; done
          echo "== seat0"; loginctl show-seat seat0 -p ActiveSession 2>&1
          echo "== gdm"; grep -E -i '^\s*(AutomaticLogin|AutomaticLoginEnable|WaylandEnable|TimedLogin)' /etc/gdm3/custom.conf 2>&1
          ls /usr/share/wayland-sessions /usr/local/share/wayland-sessions 2>&1
          echo "== sudo -n rules"; sudo -n -l 2>&1 | sed -n '1,40p'
          ls -la /usr/local/libexec/ | grep ditto
          echo "== codex / subscription"; ls -la ~/.local/bin/codex 2>&1; ls -la ~/.cache/ditto-g2-subscription 2>&1 | head
          echo "== measure state"; ls -la ~/.local/state/ditto 2>&1 | head -20
          echo "== checkouts"; for d in ~/funlab/Ditto ~/Ditto ~/src/Ditto; do [ -d "$d/.git" ] && { echo "$d"; git -C "$d" status -sb | head -5; git -C "$d" log -1 --oneline; }; done
          echo "== user processes (names only)"; ps -u "$(id -u)" -o comm= | sort | uniq -c | sort -rn | head -60
          echo "== other users graphical"; ps -eo user:20,comm= | grep -E -i 'wayfire|gnome-shell|quickshell|Xwayland|firefox|kate|foot|rustdesk' | sort | uniq -c
          echo "== resources"; free -m; df -h ~ | tail -1
          echo "== tools"; for t in cargo pnpm node quickshell wayfire jq firefox; do printf '%s: ' $t; command -v $t || echo missing; done; ls ~/.nvm/versions/node 2>&1; ls ~/wayfire/bin 2>&1 | head -3
          echo "== artifacts"; ls -d ~/funlab/Ditto/artifacts/* 2>/dev/null | tail -20
