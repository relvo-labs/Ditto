name: nightly-refmachine
# TEMPORARY probe branch (hermes/g2-ref-probe): read-only state of the
# reference machine before G2 exit runs. Not for merge.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 10
    steps:
      - name: Read-only reference machine state
        run: |
          set +e
          R=~/funlab/Ditto; cd $R
          echo "== head"; git log -1 --format='%H %cI'; git status --porcelain | head
          echo "== binaries"; ls -la --time-style=+%FT%T target/debug/ditto-core target/release/ditto-core target/release/ditto-measure target/debug/ditto-confine packages/agent-runtime/dist/ditto-agentd.mjs 2>&1
          echo "== installed units"; ls /etc/systemd/user/ | grep ditto; ls /etc/systemd/user/ditto-core.service.d/ 2>&1
          grep -h -E 'ExecStart|--agent|Environment|funlab' /etc/systemd/user/ditto-core.service /etc/systemd/user/ditto-core.service.d/*.conf 2>/dev/null | head -20
          echo "== gdm conf"; sudo -n sed -n '/\[daemon\]/,/^\[/p' /etc/gdm3/custom.conf; sudo -n cat /var/lib/AccountsService/users/neil
          echo "== conditions"; cat ~/.local/state/ditto/measure-conditions.json 2>&1
          export XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          echo "== relay"; ls -la /run/user/1000/ditto/ 2>&1
          export DITTO_G1_RELAY=/run/user/1000/ditto/verify-relay.sock
          for m in agent.runtime.get agent.providers.list desktop.windows.list; do echo "-- $m"; timeout 20 python3 tests/g1/lib/gui.py relay $m '{}' 2>&1 | head -c 1500; echo; done
          echo "-- provider status"; timeout 30 python3 tests/g1/lib/gui.py relay agent.providers.status '{"provider":"codex-app-server"}' 2>&1 | head -c 1500; echo
          echo "== keyring locked?"; busctl --user get-property org.freedesktop.secrets /org/freedesktop/secrets/collection/login org.freedesktop.Secret.Collection Locked 2>&1
          echo "== codex pin"; jq -c . tools/codex/pin.json; sha256sum $(readlink -f ~/.local/bin/codex) | cut -c1-64
          echo "== sub store"; ls ~/.cache/ditto-g2-subscription/store/ ~/.cache/ditto-g2-subscription/store/* 2>&1 | head -20
          echo "== preflight"; bash packaging/reference-image/preflight.sh 2>&1 | tail -5; echo "exit=$?"
