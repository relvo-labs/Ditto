name: nightly-refmachine
# TEMPORARY probe branch (hermes/g2-ref-probe): read-only state of the
# reference machine before G2 exit runs. Not for merge.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 10
    steps:
      - name: Read-only reference machine state
        run: |
          set +e
          echo "== tmux"
          for pid in $(pgrep -u "$(id -u)" -f '^tmux'); do printf '%s etime=%s :: %s :: %s\n' "$pid" "$(ps -o etime= -p $pid|tr -d ' ')" "$(tr '\0' ' ' </proc/$pid/cmdline)" "$(cat /proc/$pid/cgroup)"; done
          srv=$(pgrep -u "$(id -u)" -f '^tmux: server' | head -1)
          sock=$(sudo -n ls -la /proc/$srv/fd 2>/dev/null | grep -o 'socket:.*' | head -1); echo "server fds: $sock"
          sudo -n cat /proc/$srv/net/unix 2>/dev/null | grep -i tmux | head -3
          S=$(sudo -n cat /proc/$srv/net/unix 2>/dev/null | grep -o '/[^ ]*tmux[^ ]*' | head -1); echo "socket=$S"
          sudo -n -u neil tmux -S "/proc/$srv/root$S" ls 2>&1 | head; sudo -n -u neil tmux -S "/proc/$srv/root$S" list-panes -a -F '#S:#I.#P #{pane_current_command} #{pane_current_path} active=#{session_activity}' 2>&1 | head -20
          echo "== session scope members"; for p in $(cat /sys/fs/cgroup/user.slice/user-1000.slice/session-994.scope/cgroup.procs); do printf '%s %s\n' $p "$(ps -o comm=,etime= -p $p)"; done | head -40
          echo "== app scopes"; ls /sys/fs/cgroup/user.slice/user-1000.slice/user@1000.service/app.slice/ | grep -v -E '^cgroup|^memory|^cpu|^io|^pids|^misc|^rdma|^hugetlb' | head -40
          echo "== input delta 45s"; a=$(grep -E 'xhci|i8042' /proc/interrupts | awk '{s=0; for(i=2;i<=33;i++) s+=$i; print s}' | paste -sd+ | bc); sleep 45; b=$(grep -E 'xhci|i8042' /proc/interrupts | awk '{s=0; for(i=2;i<=33;i++) s+=$i; print s}' | paste -sd+ | bc); echo "usb/ps2 irq delta: $((b-a))"
          echo "== rustdesk active conn"; sudo -n ss -tnp state established 2>/dev/null | grep rustdesk
          echo "== last input by wayfire"; sudo -n cat /proc/$(pgrep -x wayfire)/io 2>/dev/null | head -2
