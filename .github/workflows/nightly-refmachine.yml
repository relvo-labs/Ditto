name: nightly-refmachine
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
# Graphics, timing and window control need the frozen reference machine. Until
# one is registered with this label the workflow simply does not run; a green
# result here is the only kind that may be cited for EX-01, EX-03 and EX-04.
jobs:
  verify:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 90
    env:
      DITTO_REFERENCE_MACHINE: '1'
      DITTO_ENVIRONMENT_LABEL: reference-machine
      DITTO_WORKSPACE: ${{ github.workspace }}
      DITTO_BINARIES: ${{ github.workspace }}/target/debug
      DITTO_ARTIFACTS: ${{ github.workspace }}/artifacts/g0
      DITTO_COMPOSITOR: wayfire
      WLR_RENDERER: gles2
    steps:
      - uses: actions/checkout@v4
      - name: Reference toolchain paths
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nvm/versions/node/v22.23.2/bin" >> "$GITHUB_PATH"
          echo "$HOME/Qt/6.10.2/gcc_64/bin" >> "$GITHUB_PATH"
          echo "$HOME/wayfire/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/wayfire/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Version fingerprint
        run: |
          mkdir -p artifacts/g0
          {
            echo "kernel=$(uname -r)"
            echo "compositor=$(wayfire --version 2>/dev/null || echo unknown)"
            echo "qt=$(qmake6 -query QT_VERSION 2>/dev/null || echo unknown)"
            echo "quickshell=$(quickshell --version 2>&1 | head -1)"
            echo "rust=$(rustc --version)"
            echo "node=$(node --version)"
            echo "ditto_commit=$GITHUB_SHA"
          } | tee "artifacts/g0/fingerprint-$GITHUB_RUN_ID.txt"
      - name: Reference-machine preflight
        run: bash packaging/reference-image/preflight.sh
      - run: cargo build --locked --workspace --bins
      - name: EX-01 window capability matrix
        run: bash tests/g0/window-matrix/run.sh
      - name: EX-03 shell restart survival
        run: bash tests/g0/shell-restart-survival/run.sh
      - name: EX-04 frame time and hot path
        run: bash tests/g0/hotpath/run.sh
      - name: Production avatar hit region
        run: bash tests/g0/avatar-hit-region/run.sh
      - name: Compositor capability probe
        run: bash tests/g0/compositor-probe/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-nightly-${{ github.run_id }}
          path: artifacts/g0/
          retention-days: 90
