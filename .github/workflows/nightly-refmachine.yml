name: nightly-refmachine
# TEMPORARY probe branch (hermes/g2-ref-probe): read-only state of the
# reference machine before G2 exit runs. Not for merge.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 10
    steps:
      - name: Read-only reference machine state
        run: |
          set +e
          echo "== cgroups of long-lived user work"
          for c in tmux claude codex agentd node foot rustdesk Runner.Listener; do for pid in $(pgrep -u "$(id -u)" -x "$c" 2>/dev/null | head -5); do printf '%s %s %s :: %s\n' "$c" "$pid" "$(ps -o etime= -p $pid | tr -d ' ')" "$(cat /proc/$pid/cgroup)"; done; done
          echo "== tmux sessions"; tmux ls 2>&1
          for s in $(tmux ls -F '#S' 2>/dev/null); do echo "-- $s"; tmux list-panes -s -t "$s" -F '#{pane_current_command} #{pane_current_path}' 2>&1 | head; done
          echo "== logind"; grep -E -i '^\s*KillUserProcesses' /etc/systemd/logind.conf /etc/systemd/logind.conf.d/*.conf 2>&1; loginctl show-user neil -p Linger -p KillUserProcesses 2>&1
          echo "== session scope"; loginctl show-session 994 -p Scope -p Service -p Leader 2>&1
          echo "== subscription"; ls -la ~/.cache/ditto-g2-subscription/store 2>&1 | head; ls ~/.cache/ditto-g2-subscription | tail -3
          echo "== rustdesk connections"; ss -tnp 2>/dev/null | grep -i rustdesk | head; sudo -n ss -tnp state established 2>/dev/null | grep -i -E 'rustdesk|21118|21119' | head
          echo "== input idle"; sudo -n cat /proc/interrupts 2>/dev/null | grep -i -E 'i8042|xhci' | head -3
          echo "== firefox"; snap list firefox 2>&1 | tail -1
          echo "== measure artifacts"; ls ~/funlab/Ditto/artifacts/ 2>&1 | head -30; ls ~/funlab/Ditto/artifacts/g1 2>/dev/null | grep -E 'agent|series' | tail -20
          echo "== repo dirty"; git -C ~/funlab/Ditto status --porcelain | head
