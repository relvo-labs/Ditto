name: nightly-refmachine
# TEMPORARY probe branch (hermes/g2-ref-probe): read-only state of the
# reference machine before G2 exit runs. Not for merge.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 10
    steps:
      - name: Read-only reference machine state
        run: |
          set +e
          cd ~/funlab/Ditto
          export XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus DITTO_G1_RELAY=/run/user/1000/ditto/verify-relay.sock
          r() { timeout 30 python3 tests/g1/lib/gui.py relay "$1" "${2:-{\}}" 2>&1 | head -c 1500; echo; }
          echo "== ensure"; r agent.runtime.ensure
          for i in $(seq 1 30); do p=$(timeout 10 python3 tests/g1/lib/gui.py relay agent.runtime.get '{}' | jq -r .result.phase); [ "$p" = ready ] && break; sleep 1; done; echo "phase=$p after ${i}s"
          r agent.runtime.get
          echo "== provider"; r agent.providers.status '{"provider":"codex-app-server"}'
          echo "== keyring collections"; busctl --user call org.freedesktop.secrets /org/freedesktop/secrets org.freedesktop.DBus.Properties Get ss org.freedesktop.Secret.Service Collections 2>&1
          for c in login default session; do printf '%s locked=' $c; busctl --user get-property org.freedesktop.secrets /org/freedesktop/secrets/collection/$c org.freedesktop.Secret.Collection Locked 2>&1; done
          echo "== docs on keyring + autologin"; grep -rn -i -E 'keyring.*(autologin|自動登入|unlock|解鎖)|(autologin|自動登入).*keyring' plan .agents docs tests/g1 tests/g2 2>/dev/null | head -10
