name: g3-reference-operations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ditto-g3-physical-qualification
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only host and installed-runtime metadata
        run: python3 tools/operational/g3_reference_probe.py --out artifacts/g3-qualification/preflight.json
      - name: Preserve sanitized metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-reference-preflight-${{ github.run_id }}
          path: artifacts/g3-qualification/preflight.json
          retention-days: 14
          if-no-files-found: error
