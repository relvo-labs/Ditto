name: nightly-refmachine
# TEMPORARY branch hermes/g2-ref-probe: G2 exit runs on the reference machine
# (phase A: in the current password login). Not for merge.
on:
  workflow_dispatch:
    inputs:
      what:
        default: probe
jobs:
  run:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - name: Phase
        env:
          WHAT: ${{ inputs.what }}
        run: |
          set +e
          cd ~/funlab/Ditto
          export PATH="$HOME/.cargo/bin:$HOME/.nvm/versions/node/v22.23.2/bin:$HOME/Qt/6.10.2/gcc_64/bin:$HOME/wayfire/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/wayfire/lib"
          export XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus DITTO_G1_RELAY=/run/user/1000/ditto/verify-relay.sock
          r() { timeout 30 python3 tests/g1/lib/gui.py relay "$1" "${2:-{\}}" 2>&1 | head -c 1200; echo; }
          git log -1 --format='HEAD %H'; git status --porcelain | head -3
          case "$WHAT" in
            probe)
              bash "$GITHUB_WORKSPACE/.hermes-probe/probe.sh"
              ;;
            phase-a)
              mark=$(mktemp); touch -d '-1 min' "$mark"
              echo "== semantic fixed (Firefox)"; bash tests/g2/semantic/run.sh --tasks fixed; echo "semantic fixed exit=$?"
              echo "== semantic holdout (Firefox)"; bash tests/g2/semantic/run.sh --tasks holdout; echo "semantic holdout exit=$?"
              echo "== EX2-13 chat"; python3 tests/g2/measure/first-frame-session.py 200 chat; echo "ff chat exit=$?"
              echo "== EX2-13 launcher"; python3 tests/g2/measure/first-frame-session.py 200 launcher; echo "ff launcher exit=$?"
              echo "== EX2-12"; node tests/g2/measure/cold-start-session.mjs 30 5; echo "cold-start exit=$?"
              find artifacts -newer "$mark" -type f | tee /tmp/phase-a-files.txt | wc -l
              tar -czf "$GITHUB_WORKSPACE/phase-a.tar.gz" -T /tmp/phase-a-files.txt
              ;;
            phase-b-start)
              # Holds the only runner on the reference machine for the whole
              # series, so no CI job runs on it while it is measured.
              bash "$GITHUB_WORKSPACE/.hermes-probe/phase-b.sh"; echo "phase-b exit=$?"
              st=$HOME/.local/state/ditto-g2-exit; cat "$st/phase-b.log"
              find artifacts -newermt "-7 hours" -type f > /tmp/pb-files.txt; tar -czf "$GITHUB_WORKSPACE/phase-b.tar.gz" -T /tmp/pb-files.txt "$st/phase-b.log"
              ;;
            phase-b-status)
              st=$HOME/.local/state/ditto-g2-exit
              systemctl --user is-active g2-exit-series.service
              tail -40 "$st/phase-b.log"; echo; tail -15 artifacts/g2-ref-exit/cold-login-progress.log 2>/dev/null
              loginctl list-sessions --no-legend
              ;;
            phase-b-collect)
              st=$HOME/.local/state/ditto-g2-exit
              cat "$st/phase-b.log"; sudo -n cmp "$st/custom.conf.orig" /etc/gdm3/custom.conf && echo gdm-identical
              find artifacts -newermt "-7 hours" -type f > /tmp/pb-files.txt; tar -czf "$GITHUB_WORKSPACE/phase-b.tar.gz" -T /tmp/pb-files.txt "$st/phase-b.log" "$st/phase-b.sh"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-exit-${{ inputs.what }}-${{ github.run_id }}
          path: phase-*.tar.gz
          if-no-files-found: ignore
          retention-days: 30
