name: g3-reference-operations
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Fixed operational phase (launch receipt is not physical success)
        required: true
        type: choice
        default: preflight
        options: [inventory, preflight, stage, auth_prepare, auth_login, auth_status, auth_reason, bridge_probe_prepare, bridge_probe, launch, collect]
      qualification_id:
        description: Numeric task ID from preflight; empty uses this workflow run ID
        required: false
        type: string
      auth_transport:
        description: Public mTLS endpoint/certificate metadata only, for auth_login
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ditto-g3-physical-qualification
  cancel-in-progress: false
jobs:
  qualification:
    if: github.ref == 'refs/heads/hermes/g3-physical-qualification'
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fixed phase with task-local state
        env:
          QUALIFICATION_PHASE: ${{ inputs.phase }}
          QUALIFICATION_ID: ${{ inputs.qualification_id }}
          DITTO_G3_AUTH_TRANSPORT: ${{ inputs.auth_transport }}
        run: |
          set -euo pipefail
          case "$QUALIFICATION_PHASE" in inventory|preflight|stage|auth_prepare|auth_login|auth_status|auth_reason|bridge_probe_prepare|bridge_probe|launch|collect) ;; *) exit 64 ;; esac
          mkdir -p artifacts/g3-qualification/publish
          if [ "$QUALIFICATION_PHASE" = inventory ]; then
            python3 -c 'import json; print(json.dumps({"phase":"inventory","status":"closed","old_store_discovery":"not_run"}))' > artifacts/g3-qualification/phase.json
            exit 0
          fi
          python3 tools/operational/g3_ops.py "$QUALIFICATION_PHASE" --id "${QUALIFICATION_ID:-$GITHUB_RUN_ID}" > artifacts/g3-qualification/phase.json
      - name: Preserve only constructed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-reference-operations-${{ github.run_id }}
          path: |
            artifacts/g3-qualification/phase.json
            artifacts/g3-qualification/publish/receipt.json
          retention-days: 14
          if-no-files-found: error
