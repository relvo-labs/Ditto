name: nightly-refmachine
# TEMPORARY branch hermes/g2-ref-probe: G2 exit runs on the reference machine
# (phase A: in the current password login). Not for merge.
on:
  workflow_dispatch:
    inputs:
      what:
        default: probe
jobs:
  run:
    runs-on: [self-hosted, ditto-refmachine]
    timeout-minutes: 240
    steps:
      - name: Phase
        env:
          WHAT: ${{ inputs.what }}
        run: |
          set +e
          cd ~/funlab/Ditto
          export PATH="$HOME/.cargo/bin:$HOME/.nvm/versions/node/v22.23.2/bin:$HOME/Qt/6.10.2/gcc_64/bin:$HOME/wayfire/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/wayfire/lib"
          export XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus DITTO_G1_RELAY=/run/user/1000/ditto/verify-relay.sock
          r() { timeout 30 python3 tests/g1/lib/gui.py relay "$1" "${2:-{\}}" 2>&1 | head -c 1200; echo; }
          git log -1 --format='HEAD %H'; git status --porcelain | head -3
          case "$WHAT" in
            probe)
              echo "== journal 13:43-13:55"; journalctl --user --since '2026-10-13 13:43:30' --until '2026-10-13 13:55' -o short-iso --no-pager | grep -v -E 'ditto-rpc ' | grep -i -E 'chat|launcher|shortcut|stipc|feed|frame|Super|keybind|warn|error|lock|output|dpms' | head -60
              echo "== count"; journalctl --user --since '2026-10-13 13:43:30' --until '2026-10-13 13:55' -o cat --no-pager | wc -l
              echo "== wayfire log tail"; journalctl --user -u ditto-wayfire.scope --since '2026-10-13 13:00' --until '2026-10-13 13:55' -o short-iso --no-pager | tail -30
              echo "== drm"; for c in /sys/class/drm/card*-*; do printf '%s %s %s\n' "$(basename $c)" "$(cat $c/status 2>/dev/null)" "$(cat $c/dpms 2>/dev/null)"; done
              echo "== earlier G2 first-frame on ref?"; ls ~/funlab/Ditto/artifacts/g2 | grep -i -E 'first-frame|cold-start' | tail
              echo "== keyring now"; for c in login session; do printf '%s locked=' $c; busctl --user get-property org.freedesktop.secrets /org/freedesktop/secrets/collection/$c org.freedesktop.Secret.Collection Locked 2>&1; done
              ;;
            phase-a)
              mark=$(mktemp); touch -d '-1 min' "$mark"
              echo "== semantic fixed (Firefox)"; bash tests/g2/semantic/run.sh --tasks fixed; echo "semantic fixed exit=$?"
              echo "== semantic holdout (Firefox)"; bash tests/g2/semantic/run.sh --tasks holdout; echo "semantic holdout exit=$?"
              echo "== EX2-13 chat"; python3 tests/g2/measure/first-frame-session.py 200 chat; echo "ff chat exit=$?"
              echo "== EX2-13 launcher"; python3 tests/g2/measure/first-frame-session.py 200 launcher; echo "ff launcher exit=$?"
              echo "== EX2-12"; node tests/g2/measure/cold-start-session.mjs 30 5; echo "cold-start exit=$?"
              find artifacts -newer "$mark" -type f | tee /tmp/phase-a-files.txt | wc -l
              tar -czf "$GITHUB_WORKSPACE/phase-a.tar.gz" -T /tmp/phase-a-files.txt
              ;;
            phase-b-start)
              st=$HOME/.local/state/ditto-g2-exit; mkdir -p "$st"
              systemctl --user is-active g2-exit-series.service && { echo "already running"; exit 1; }
              cargo build --locked --release -p ditto-measure -p ditto-core -p ditto-supervisor -p dittoctl -p ditto-confine 2>&1 | tail -3
              git status --porcelain | head -3
              ls artifacts/g2-ref-exit 2>/dev/null && { echo "artifacts/g2-ref-exit exists; refusing"; exit 1; }
              cat > "$st/phase-b.sh" <<'SH'
          #!/usr/bin/env bash
          # G2 EX2-14 on the reference machine: temporary GDM autologin, 4 states x 3 cold logins.
          set -uo pipefail
          st=$HOME/.local/state/ditto-g2-exit; ts=$(date -u +%Y%m%dT%H%M%SZ)
          log() { printf '%s %s\n' "$(date -u +%FT%TZ)" "$*" >>"$st/phase-b.log"; }
          sudo -n cp -p /etc/gdm3/custom.conf "$st/custom.conf.orig" && sudo -n cp -p /etc/gdm3/custom.conf /etc/gdm3/custom.conf.g2-exit-$ts
          sha256sum /etc/gdm3/custom.conf >"$st/custom.conf.sha256"
          restore() {
            sudo -n cp -p "$st/custom.conf.orig" /etc/gdm3/custom.conf
            if sudo -n cmp -s "$st/custom.conf.orig" /etc/gdm3/custom.conf && sha256sum -c "$st/custom.conf.sha256" >/dev/null; then log "gdm custom.conf restored byte-identical"; else log "RESTORE MISMATCH"; fi
            log "relogin to the login screen"; sudo -n /usr/local/libexec/ditto-relogin >>"$st/phase-b.log" 2>&1
            log "phase-b done"
          }
          trap restore EXIT
          sudo -n python3 - <<'PY'
          import re
          p='/etc/gdm3/custom.conf'; s=open(p).read()
          s=s.replace('[daemon]\n','[daemon]\nAutomaticLoginEnable=True\nAutomaticLogin=neil\n',1)
          open(p,'w').write(s)
          PY
          log "autologin enabled"; grep -A3 '^\[daemon\]' /etc/gdm3/custom.conf >>"$st/phase-b.log"
          cd ~/funlab/Ditto
          DITTO_ARTIFACTS=$PWD/artifacts/g2-ref-exit DITTO_SERIES_FINAL_RELOGIN=0 DITTO_LOGIN_TIMEOUT_SECONDS=600 \
            bash tests/g1/measure/series.sh rescue_no_node desktop_full_no_agent desktop_full_agent_warm desktop_full_agent_active >>"$st/phase-b.log" 2>&1
          log "series exit $?"
          SH
              sed -i 's/^          //' "$st/phase-b.sh"; chmod +x "$st/phase-b.sh"; bash -n "$st/phase-b.sh" && echo syntax-ok
              systemd-run --user --unit=g2-exit-series --collect --same-dir \
                -E PATH="$PATH" -E LD_LIBRARY_PATH="$LD_LIBRARY_PATH" bash "$st/phase-b.sh"
              sleep 5; systemctl --user status g2-exit-series.service --no-pager | head -5; cat "$st/phase-b.log"
              ;;
            phase-b-status)
              st=$HOME/.local/state/ditto-g2-exit
              systemctl --user is-active g2-exit-series.service
              tail -40 "$st/phase-b.log"; echo; tail -15 artifacts/g2-ref-exit/cold-login-progress.log 2>/dev/null
              loginctl list-sessions --no-legend
              ;;
            phase-b-collect)
              st=$HOME/.local/state/ditto-g2-exit
              cat "$st/phase-b.log"; sudo -n cmp "$st/custom.conf.orig" /etc/gdm3/custom.conf && echo gdm-identical
              tar -czf "$GITHUB_WORKSPACE/phase-b.tar.gz" artifacts/g2-ref-exit "$st/phase-b.log" "$st/phase-b.sh"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-exit-${{ inputs.what }}-${{ github.run_id }}
          path: phase-*.tar.gz
          if-no-files-found: ignore
          retention-days: 30
