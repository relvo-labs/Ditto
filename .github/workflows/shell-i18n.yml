name: shell-i18n
# EX1-13 ④: no Ditto-owned CJK string outside qsTr(), every qsTr() source and
# every Core translation key translated in both catalogues, and the runtime
# catalogues (JSON, .qm) regenerated from the .ts files. qmllint then checks
# that every Shell QML file parses and enforces zero-warning budgets for the
# three files listed in scripts/lint-shell-qml.mjs. Other warnings are reported
# without failing: Quickshell ships no qmllint type information for its grouped
# properties.
on:
  push:
    branches: [main]
    paths: ['shell/**', 'scripts/lint-shell-*.mjs', 'crates/ditto-protocol/src/change.rs', '.github/workflows/shell-i18n.yml']
  pull_request:
    paths: ['shell/**', 'scripts/lint-shell-*.mjs', 'crates/ditto-protocol/src/change.rs', '.github/workflows/shell-i18n.yml']
jobs:
  lint:
    runs-on: [self-hosted, ditto-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: i18n lint
        run: node scripts/lint-shell-i18n.mjs
      - name: qmllint (syntax and warning budgets)
        run: |
          qt="${QT_PREFIX:-$HOME/Qt/6.10.2/gcc_64}"
          if [ ! -x "$qt/bin/qmllint" ]; then
            echo "::notice::qmllint not found under $qt; QML syntax not checked on this runner"
            exit 0
          fi
          node scripts/lint-shell-qml.mjs "$qt"
