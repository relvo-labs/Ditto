name: node
on:
  push:
    branches: [main]
    paths: ['packages/**', 'schema/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.nvmrc', '.github/workflows/node.yml']
  pull_request:
    paths: ['packages/**', 'schema/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.nvmrc', '.github/workflows/node.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ditto/protocol typecheck
      - run: cargo build --locked -p ditto-core
      - run: pnpm --filter @ditto/protocol test
