name: licenses
on:
  push:
    branches: [main]
    paths: ['Cargo.lock', 'pnpm-lock.yaml', '.github/workflows/licenses.yml']
  pull_request:
    paths: ['Cargo.lock', 'pnpm-lock.yaml', '.github/workflows/licenses.yml']
  workflow_dispatch:
jobs:
  inventory:
    runs-on: [self-hosted, ditto-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p artifacts/licenses
      - run: cargo metadata --locked --format-version 1 > artifacts/licenses/cargo-metadata.json
      - run: pnpm licenses list --json > artifacts/licenses/node-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: g0-dependency-license-inventory
          path: artifacts/licenses/
