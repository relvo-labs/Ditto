[workspace]
resolver = "2"
members = ["crates/ditto-protocol", "crates/ditto-store", "crates/ditto-system", "crates/ditto-supervisor", "crates/ditto-compositor", "crates/ditto-core", "crates/dittoctl", "crates/ditto-measure", "crates/ditto-confine", "crates/ditto-test-host", "crates/ditto-generation", "crates/ditto-firstboot-account"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Core hashes and scans the pinned Codex binary (~290 MB) before launching
# it; unoptimized, that takes seconds in a debug build.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
