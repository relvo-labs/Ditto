# Development-only compositor fixture, the Wayfire counterpart of sway.conf.
# G0 reference-platform decisions use the real machine; this file exists so the
# capability probe can be pointed at a second compositor, which D-02 requires.
#
# Wayfire puts most Wayland protocols behind plugins, so a short plugin list
# does not measure the compositor, it measures the list. Everything here is
# either a protocol the capability matrix has a row for, or the IPC the probe
# queries through. Plugins that move windows on their own (simple-tile, move,
# place) stay out, because they would show up in the exclusive-zone measurement.
#
#   ipc, ipc-rules   the probe's queries; Wayfire has no sway-compatible IPC
#   stipc            synthetic input, which is what makes C-07 probeable here
#   foreign-toplevel zwlr_foreign_toplevel_management_v1, rows C-02 and C-03
#   ext-toplevel     ext_foreign_toplevel_list_v1, the neutral successor
#   xdg-activation   row C-09
#   session-lock     row C-10
#   wayfire-shell, shortcuts-inhibit, security-context-v1
#                    present so the inventory reflects a desktop configuration
#                    rather than a bare compositor
#   wm-actions       minimize, which configure-view does not carry
#   vswitch          workspace switching; without it the grid can be read but
#                    not changed, so desktop.workspaces.activate has no path
#   command          the IPC bindings Core's global shortcuts use (C-16, D-33);
#                    without it no shortcut is bound and every change the
#                    compositor reads back fails on the shortcut table
#
# wm-actions and vswitch are what Core's Wayfire adapter calls. A Wayfire session without
# them loads, but `desktop.windows.set_state` minimize and
# `desktop.workspaces.activate` report unsupported.
[core]
plugins = ipc ipc-rules stipc foreign-toplevel ext-toplevel xdg-activation session-lock wayfire-shell shortcuts-inhibit security-context-v1 input-method-v1 wm-actions vswitch command
xwayland = true
close_top_view = none

# Wayfire's input-method-v2 relay is known to be less reliable with Fcitx5.
# Keep it disabled and use Wayfire's dedicated input-method-v1 bridge while
# retaining text-input-v3 on the Qt client side.
[workarounds]
enable_input_method_v2 = false

[input-method-v1]
enable_text_input_v1 = true
enable_text_input_v3 = true

[output:HEADLESS-1]
mode = 1920x1080@60000
position = 0,0
scale = 1.000000

[input]
xkb_layout = us
