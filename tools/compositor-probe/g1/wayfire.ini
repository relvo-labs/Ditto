# Development-only fixture for the G1 probes C-15..C-19. It is
# tools/dev-wayland/wayfire.ini plus the `command` plugin (C-16). simple-tile
# is deliberately NOT loaded here: C-15 asks whether it can be loaded while
# the session runs, so it must start absent.
[core]
plugins = ipc ipc-rules stipc foreign-toplevel ext-toplevel xdg-activation session-lock wayfire-shell shortcuts-inhibit security-context-v1 wm-actions vswitch command
xwayland = false
close_top_view = none

[output:HEADLESS-1]
mode = 1920x1080@60000
position = 0,0
scale = 1.000000

[input]
xkb_layout = us
