<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e8e0fa"><title>Ditto — 你的桌面，隨你而變</title><meta name="description" content="用對話組合你的桌面。試看變更、替換模組、保存工作環境，與住在桌面裡的 Ditto 一起工作。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='11' fill='%23a58bd7'/%3E%3Ccircle cx='11' cy='14' r='2' fill='white'/%3E%3Ccircle cx='21' cy='14' r='2' fill='white'/%3E%3Cpath d='M12 21q4 4 8 0' stroke='white' fill='none' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><div class="wallpaper" aria-hidden="true"></div>
<header class="menubar"><div class="brand"><button id="brandButton" aria-label="開啟應用程式"><span class="brand-symbol">✳</span><strong>ditto</strong></button><span class="bar-separator"></span><button id="profileMenu" class="current-profile">柔光果凍 <span data-icon="chevron"></span></button></div><nav class="workspaces" aria-label="工作區"><button data-workspace="1" class="active" aria-label="工作區 1">1</button><button data-workspace="2" aria-label="工作區 2">2</button><button data-workspace="3" aria-label="工作區 3">3</button><button data-workspace="4" aria-label="工作區 4">4</button></nav><div class="system-status"><button id="aboutButton" class="prototype-tag">前端體驗版</button><span data-icon="wifi" title="示範系統狀態"></span><button id="notificationButton" aria-label="切換勿擾模式" data-icon="bell"></button><span data-icon="battery"></span><time id="clock"></time><button id="searchButton" aria-label="搜尋應用程式" data-icon="search"></button></div></header>
<main id="desktop" aria-label="Ditto 桌面"><div class="desktop-heading"><span id="workspaceEyebrow">01 — SOFT JELLY</span><p id="desktopGreeting">留一點空間，給新的可能。</p></div><div class="weather" id="weatherWidget"><span data-icon="sun"></span><div>24°<small>晴朗的一天 · 示範</small></div></div>
<div id="petArea" class="pet-area"><div class="pet-shadow"></div><button id="ditto" aria-label="點擊 Ditto 開始對話" aria-expanded="false"><div class="jelly-body"><img src="ditto-body.png" alt="柔軟透明的紫色 Ditto" draggable="false"><div class="face"><span class="eye eye-left"></span><span class="eye eye-right"></span><svg class="mouth" viewBox="0 0 60 32"><path d="M10 10 Q30 35 50 10"/></svg></div></div></button><button id="petHint" class="pet-hint"><span>今天，想把桌面變成什麼樣子？</span><small>點我聊聊 <span>↗</span></small></button><div id="petStatus" class="pet-status" role="status"></div></div>
<div id="windows"></div><div id="widgets"></div>
<div class="desktop-empty" id="workspaceEmpty" hidden><span data-icon="layout"></span><h2>一個新的開始</h2><p>這個工作區還沒有視窗。<br>開啟應用，或請 Ditto 幫你安排。</p><button class="button primary" data-chat="幫我安排這個工作區">與 Ditto 一起開始</button></div>
</main>
<div class="bottom-left"><button class="composition-pill" data-center="profiles"><span data-icon="layers"></span><span id="compositionLabel">柔光果凍</span><span class="small-count" id="moduleCount">6 個模組</span></button><span class="device-note">配置與筆記保存在此瀏覽器</span></div>
<div class="dock-wrap" id="dockWrap"><nav id="dock" class="dock" aria-label="應用程式 Dock"></nav></div>
<section id="chat" class="chat-panel" aria-label="Ditto 對話" hidden><header class="chat-header"><div class="avatar-mini"><img src="ditto-body.png" alt=""><span>•ᴗ•</span></div><div class="chat-title"><strong>Ditto</strong><small id="chatStatus">一起，讓桌面更像你。</small></div><button id="chatExpand" class="icon-button" aria-label="展開對話" data-icon="expand"></button><button id="chatClose" class="icon-button" aria-label="收起對話" data-icon="close"></button></header><div class="context-strip"><span data-icon="layout"></span><button id="contextButton">目前桌面配置</button><span class="local-badge">本機示範 · 未接 LLM</span></div><div id="messages" class="messages" role="log" aria-live="polite"></div><div id="suggestions" class="suggestions"></div><form id="chatForm" class="chat-form"><textarea id="chatInput" rows="2" placeholder="描述你想要的桌面…" aria-label="告訴 Ditto 你想要的桌面" maxlength="600"></textarea><div class="composer-footer"><span><kbd>Enter</kbd> 傳送 · <kbd>⇧ Enter</kbd> 換行</span><button id="sendButton" type="submit" aria-label="傳送訊息" data-icon="up"></button></div></form><div class="chat-footer">只操作此原型桌面 <button id="chatHelp">能做什麼？</button></div></section>
<div id="previewBar" class="preview-bar" hidden><div><span class="preview-dot"></span><strong>正在試看</strong><span id="previewTitle"></span></div><div><button id="cancelPreview" class="button subtle">取消試看</button><button id="keepPreview" class="button primary">保留變更 <span data-icon="check"></span></button></div></div>
<dialog id="centerDialog" class="center-dialog"><header class="center-header"><div><span class="eyebrow">MAKE IT YOURS</span><h2 id="centerTitle">桌面組合</h2></div><button class="icon-button" id="centerClose" aria-label="關閉管理中心" data-icon="close"></button></header><nav id="centerTabs" class="center-tabs" aria-label="桌面管理"><button data-tab="profiles">桌面組合</button><button data-tab="plugins">模組</button><button data-tab="history">變更紀錄</button><button data-tab="settings">個人化</button></nav><div id="centerBody" class="center-body"></div></dialog>
<dialog id="launcher" class="launcher-dialog"><div class="launcher-search"><span data-icon="search"></span><input id="launcherInput" aria-label="搜尋應用、模組或動作" placeholder="搜尋應用、模組或動作…"><kbd>Esc</kbd></div><div id="launcherResults"></div><footer>直接輸入想做的事，也可以交給 Ditto <kbd>⌘ / Ctrl + K</kbd></footer></dialog>
<dialog id="nameDialog" class="name-dialog"><form id="nameForm"><span class="eyebrow">YOUR SPACE</span><h2>保存這個桌面</h2><p>把現在的模組、配色與布局，留給下次的自己。</p><label for="profileName">組合名稱</label><input id="profileName" maxlength="40" required placeholder="例如：我的開發桌面"><div class="dialog-actions"><button type="button" class="button subtle" id="nameCancel">取消</button><button class="button primary" type="submit">保存組合</button></div></form></dialog>
<div id="toast" role="status"></div><input id="importInput" type="file" accept="application/json,.json" hidden><script type="module" src="app.js"></script></body></html>
